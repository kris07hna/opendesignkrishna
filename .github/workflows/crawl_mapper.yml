name: Enterprise Web Flow & UX Mapper

# ---------------------------------------------------------
# Note: You can also run these professional features locally
# using the OpenDesign CLI:
#   od user-flow --url <URL> --goal <GOAL> --project <ID> --model opencode/deepseek-v4-flash-free
# ---------------------------------------------------------

# ---------------------------------------------------------
# Define when this workflow can be triggered (manually via GitHub UI)
# ---------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Target website URL to map (e.g. https://example.com)'
        required: true
        type: string
      goal:
        description: 'Navigation goal / what to map (e.g. "Order a brand bag" or "Map all sections")'
        required: true
        type: string
      viewport:
        description: 'Viewport configuration'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'desktop-only'
          - 'mobile-only'
      full_page:
        description: 'Capture full scrolled-page height (instead of viewport only)'
        required: false
        default: true
        type: boolean
      mode:
        description: 'Crawler Mode'
        required: true
        default: 'ux-ia'
        type: choice
        options:
          - 'flow'
          - 'spider'
          - 'ux-ia'
      max_steps:
        description: 'Maximum number of steps/clicks the AI can perform per viewport'
        required: false
        default: '10'
        type: string
      model:
        description: 'OpenCode model to use'
        required: true
        default: 'opencode/deepseek-v4-flash-free'
        type: string

jobs:
  crawl_and_map:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:main
      # Ignore entrypoint so Actions can run standard job steps
      options: --entrypoint ""
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Start OpenDesign Daemon (Background)
        run: |
          echo "Starting pre-built OpenDesign Daemon from container..."
          # The container already has the daemon built in /app
          cd /app && node apps/daemon/dist/cli.js --no-open &
          # Give it a few seconds to initialize
          sleep 10

      - name: Advanced AI Extraction (od user-flow)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          echo "Running full OpenDesign advanced CLI extraction..."
          
          # We use the advanced CLI command directly which automatically creates whiteboards!
          # We run the command globally since the daemon is running locally
          node /app/apps/daemon/dist/cli.js user-flow \
            --url "${{ inputs.url }}" \
            --goal "${{ inputs.goal }}" \
            --project default \
            --model "${{ inputs.model }}" \
            --json > output.json
            
          echo "Crawler Output:"
          cat output.json

      - name: Extract Artifacts Path
        id: parse_output
        run: |
          # Parse the json output to find where the sitemap/sketch was saved
          SKETCH_PATH=$(grep -o '"sketchPath":"[^"]*' output.json | grep -o '[^"]*$')
          SITEMAP_PATH=$(grep -o '"sitemapPath":"[^"]*' output.json | grep -o '[^"]*$')
          
          mkdir -p artifacts
          if [ ! -z "$SKETCH_PATH" ] && [ -f "$SKETCH_PATH" ]; then
            cp "$SKETCH_PATH" artifacts/
          fi
          if [ ! -z "$SITEMAP_PATH" ] && [ -f "$SITEMAP_PATH" ]; then
            cp "$SITEMAP_PATH" artifacts/
          fi

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Enterprise-UX-Flow-Map
          path: artifacts/
          retention-days: 7
