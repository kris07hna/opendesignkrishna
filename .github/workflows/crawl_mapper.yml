name: Enterprise Web Flow & UX Mapper

# ---------------------------------------------------------
# Note: You can also run these professional features locally
# using the OpenDesign CLI:
#   od user-flow --url <URL> --goal <GOAL> --project <ID> --model opencode/deepseek-v4-flash-free
# ---------------------------------------------------------

# ---------------------------------------------------------
# Define when this workflow can be triggered (manually via GitHub UI)
# ---------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Target website URL to map (e.g. https://example.com)'
        required: true
        type: string
      goal:
        description: 'Navigation goal / what to map (e.g. "Order a brand bag" or "Map all sections")'
        required: true
        type: string
      viewport:
        description: 'Viewport configuration'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'desktop-only'
          - 'mobile-only'
      full_page:
        description: 'Capture full scrolled-page height (instead of viewport only)'
        required: false
        default: true
        type: boolean
      mode:
        description: 'Crawler Mode'
        required: true
        default: 'ux-ia'
        type: choice
        options:
          - 'flow'
          - 'spider'
          - 'ux-ia'
      max_steps:
        description: 'Maximum number of steps/clicks the AI can perform per viewport'
        required: false
        default: '10'
        type: string
      model:
        description: 'OpenCode model to use'
        required: true
        default: 'opencode/deepseek-v4-flash-free'
        type: string

jobs:
  crawl_and_map:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:main
      # Ignore entrypoint so Actions can run standard job steps
      options: --entrypoint ""
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Start OpenDesign Daemon (Background)
        run: |
          echo "Starting pre-built OpenDesign Daemon from container..."
          # The container already has the daemon built in /app
          cd /app && node apps/daemon/dist/cli.js --no-open &
          
          # Wait for daemon to be fully ready to avoid race conditions (daemon defaults to 7456)
          echo "Waiting for daemon to be ready..."
          timeout 30 bash -c 'until curl -s http://localhost:7456 > /dev/null || curl -s http://localhost:7456/api/health > /dev/null; do sleep 1; done'
          echo "Daemon is ready!"

      - name: Initialize Project Database and Run Extraction
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          echo "Creating dummy project to avoid fresh-database crash..."
          PROJECT_JSON=$(node /app/apps/daemon/dist/cli.js project create --name "CI Runner" --json)
          PROJECT_ID=$(echo "$PROJECT_JSON" | python3 -c "import sys, json; print(json.load(sys.stdin)['project']['id'])")
          echo "Created project ID: $PROJECT_ID"
          
          echo "Running full OpenDesign advanced CLI extraction..."
          
          # Run the crawler without --json so full output and progress lines are printed in real-time
          node /app/apps/daemon/dist/cli.js user-flow \
            --url "${{ inputs.url }}" \
            --goal "${{ inputs.goal }}" \
            --project "$PROJECT_ID" 2>&1 | tee run.log

      - name: Extract Artifacts Path
        id: parse_output
        run: |
          set +e
          mkdir -p artifacts
          
          # Copy any screenshots or flow maps generated in /app
          if [ -d "/app/screenshots_ai" ]; then
            cp -r /app/screenshots_ai/* artifacts/ 2>/dev/null || true
          fi
          
          # Find any .json or .sketch.json files in projects directory or root
          find /app -name "*.sketch.json" -exec cp {} artifacts/ \; 2>/dev/null || true
          find /app -name "sitemap_ai.json" -exec cp {} artifacts/ \; 2>/dev/null || true

          # List what we collected
          echo "Collected artifacts:"
          ls -la artifacts/

      - name: Upload Output Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Enterprise-UX-Flow-Map
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
