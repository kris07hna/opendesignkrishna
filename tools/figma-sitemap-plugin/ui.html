<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
      font-size: 13px;
    }
    h2 {
      font-size: 16px;
      margin-top: 0;
      margin-bottom: 12px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .drop-zone {
      border: 2px dashed #38bdf8;
      border-radius: 8px;
      padding: 24px 16px;
      text-align: center;
      background: #1e293b;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 12px;
    }
    .drop-zone:hover {
      background: #334155;
      border-color: #60a5fa;
    }
    .drop-zone p {
      margin: 0 0 4px 0;
      font-weight: 600;
    }
    .drop-zone span {
      font-size: 11px;
      color: #94a3b8;
    }
    textarea {
      width: 100%;
      height: 100px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #f8fafc;
      padding: 8px;
      font-family: monospace;
      font-size: 11px;
      box-sizing: border-box;
      resize: vertical;
      margin-bottom: 12px;
    }
    .btn {
      width: 100%;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #1d4ed8;
    }
    .status {
      margin-top: 10px;
      font-size: 12px;
      color: #38bdf8;
      text-align: center;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <h2>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    OpenDesign Sitemap Generator
  </h2>
  
  <div class="drop-zone" id="dropZone">
    <p>📄 Drop raw_ia_graph.json here</p>
    <span>or click to select file</span>
    <input type="file" id="fileInput" accept=".json" style="display: none;">
  </div>

  <textarea id="jsonText" placeholder="Or paste JSON sitemap content here..."></textarea>
  
  <button class="btn" id="generateBtn">Build Figma Sitemap Tree</button>
  
  <div class="status" id="status"></div>

  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const jsonText = document.getElementById('jsonText');
    const generateBtn = document.getElementById('generateBtn');
    const status = document.getElementById('status');

    dropZone.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) handleFile(file);
    });

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.style.borderColor = '#60a5fa';
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.style.borderColor = '#38bdf8';
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.style.borderColor = '#38bdf8';
      const file = e.dataTransfer.files[0];
      if (file) handleFile(file);
    });

    function handleFile(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        jsonText.value = e.target.result;
        status.innerText = `Loaded: ${file.name}`;
      };
      reader.readAsText(file);
    }

    generateBtn.addEventListener('click', () => {
      const content = jsonText.value.trim();
      if (!content) {
        status.innerText = 'Please select or paste a JSON sitemap file.';
        return;
      }
      try {
        const parsed = JSON.parse(content);
        status.innerText = 'Generating sitemap tree in Figma...';
        parent.postMessage({ pluginMessage: { type: 'GENERATE_SITEMAP', payload: parsed } }, '*');
      } catch(err) {
        status.innerText = 'Invalid JSON syntax. Please check file formatting.';
      }
    });
  </script>
</body>
</html>
